<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sura Table menu cover</title>
  <desc id="desc">An original warm editorial cover for Sura Table, inspired by Saudi dining, with olive, cream and brass tones.</desc>
  <defs>
    <radialGradient id="bg" cx="72%" cy="28%" r="90%"><stop offset="0" stop-color="#5b674e"/><stop offset="1" stop-color="#344331"/></radialGradient>
    <linearGradient id="brass" x1="0" x2="1"><stop offset="0" stop-color="#8d642d"/><stop offset=".5" stop-color="#d3ad6a"/><stop offset="1" stop-color="#9d7237"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1250" cy="140" r="250" fill="#f6f0e5" opacity=".07"/>
  <circle cx="1430" cy="720" r="330" fill="#b78a42" opacity=".10"/>
  <path d="M80 770 C300 610 420 620 560 735 C720 865 900 840 1050 700 C1180 580 1300 535 1510 650" fill="none" stroke="#d3ad6a" stroke-width="2" opacity=".7"/>
  <path d="M90 805 C310 645 430 655 570 770 C720 890 920 865 1070 725 C1210 595 1320 565 1530 680" fill="none" stroke="#f6f0e5" stroke-width="1" opacity=".25"/>
  <g transform="translate(1180 170)" opacity=".9">
    <circle r="180" fill="none" stroke="url(#brass)" stroke-width="3"/>
    <circle r="145" fill="none" stroke="#f6f0e5" stroke-width="1" opacity=".45"/>
    <path d="M-85 35 C-35 -25 35 -25 85 35 C40 18 -40 18 -85 35Z" fill="#b78a42" opacity=".75"/>
    <path d="M-15 -110 C20 -72 22 -35 0 -5 C-24 -38 -27 -74 -15 -110Z" fill="#f6f0e5" opacity=".35"/>
  </g>
  <g fill="#f6f0e5">
    <text x="120" y="290" font-family="Georgia,serif" font-size="78" letter-spacing="2">مائدة سُرى</text>
    <text x="126" y="355" font-family="Arial,sans-serif" font-size="26" letter-spacing="7" opacity=".78">SURA TABLE</text>
    <rect x="126" y="390" width="170" height="2" fill="#d3ad6a"/>
    <text x="126" y="445" font-family="Arial,sans-serif" font-size="25" opacity=".82">مذاق سعودي معاصر، يُقدّم بهدوء وكرم</text>
    <text x="126" y="486" font-family="Arial,sans-serif" font-size="17" opacity=".58">Contemporary Saudi dining, served with calm generosity</text>
  </g>
  <g transform="translate(126 610)" opacity=".72" fill="none" stroke="#d3ad6a" stroke-width="2">
    <path d="M0 0 C70 -55 120 -55 190 0"/>
    <path d="M25 18 C95 -32 145 -32 215 18" opacity=".45"/>
  </g>
