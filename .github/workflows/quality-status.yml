name: Menu V3 Quality Status Bridge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  statuses: write

jobs:
  publish-quality-status:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mirror Menu V3 Quality as required commit status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const workflowId = "quality.yml";
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (let attempt = 1; attempt <= 90; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                event: "pull_request",
                head_sha: sha,
                per_page: 10,
              });
              const run = response.data.workflow_runs.find((candidate) => candidate.head_sha === sha);

              if (run?.status === "completed") {
                const state = run.conclusion === "success" ? "success" : "failure";
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha,
                  state,
                  context: "quality",
                  description: state === "success"
                    ? "Menu V3 Quality workflow passed."
                    : `Menu V3 Quality workflow concluded ${run.conclusion}.`,
                  target_url: run.html_url,
                });
                core.info(`Published quality=${state} for ${sha} from ${run.html_url}`);
                if (state !== "success") core.setFailed(`Menu V3 Quality concluded ${run.conclusion}.`);
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            core.setFailed("Timed out waiting for Menu V3 Quality workflow for the current PR head.");
