name: Menu V3 Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      # TanStack Start generates routeTree.gen.ts during Vite build; generate it before tsc.
      - name: Generate route tree
        run: npx vite build --mode development
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
