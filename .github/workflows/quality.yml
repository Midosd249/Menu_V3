name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menu_v3_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d menu_v3_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate route tree
        run: npx vite build --mode development
      - name: Verify generated route tree is committed
        run: |
          if ! git diff --exit-code -- src/routeTree.gen.ts; then
            echo "Generated route artifacts are stale. Commit the route tree produced by route generation."
            git diff -- src/routeTree.gen.ts
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: |
          mkdir -p .grok
          set +e
          npm test 2>&1 | tee .grok/npm-test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          exit "$STATUS"
      - name: Upload npm test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w7-9-npm-test-diagnostics
          path: .grok/npm-test.log
          if-no-files-found: warn
          retention-days: 2
      - name: W7.4 Studio Home contract tests
        run: node --test tests/w7-4-studio-home.test.mjs
      - name: W7.5 Menu Workspace contract tests
        run: node --test tests/w7-5-menu-workspace.test.mjs
      - name: W7.6 Growth Workspace contract tests
        run: node --test tests/w7-6-growth-workspace.test.mjs
      - name: W7.7 Customers Workspace contract tests
        run: node --test tests/w7-7-customers-workspace.test.mjs
      - name: W7.8 Platform Admin shell contract tests
        run: node --test tests/w7-8-admin-shell.test.mjs
      - name: W7.9 Platform Admin route contract tests
        run: node --test tests/w7-9-admin-routes.test.mjs
      - name: W7.10 responsive design-system contract tests
        run: node --test tests/w7-10-responsive.test.mjs
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Playwright runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser template QA — all themes
        run: |
          mkdir -p .grok
          setsid bash -c 'unset RUNNER_TRACKING_ID; exec node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 8081' > .grok/preview.log 2>&1 < /dev/null &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail http://127.0.0.1:8081/ >/dev/null; then
              echo "[preview] serving http://127.0.0.1:8081/"
              if npm run performance:audit -- http://127.0.0.1:8081/themes/preview?theme=editorial; then
                echo "[performance] browser measurement completed"
              else
                echo "[performance] Browser measurement failed — preview log follows"
                cat .grok/preview.log
                exit 1
              fi
              if npm run qa:template http://127.0.0.1:8081/themes/preview?theme=editorial -- --all-themes; then
                exit 0
              fi
              echo "[preview] Browser QA failed — preview log follows"
              cat .grok/preview.log
              exit 1
            fi
            sleep 0.25
          done
          echo "[preview] failed to become ready — see .grok/preview.log"
          cat .grok/preview.log
          exit 1
      - name: Prepare Customer Lifecycle browser fixture
        run: |
          cat > migrations/99999998_w7_3_customer_activation_fixture.sql <<'SQL'
          alter table leads
            add column if not exists account_user_id text,
            add column if not exists brand_name_en text not null default '',
            add column if not exists business_type text not null default 'restaurant',
            add column if not exists activation_status text not null default 'legacy',
            add column if not exists activation_requested_at timestamptz,
            add column if not exists decision_at timestamptz,
            add column if not exists decision_by text,
            add column if not exists decision_reason text not null default '';
          create unique index if not exists leads_account_user_unique_idx
            on leads (account_user_id)
            where account_user_id is not null;
          create index if not exists leads_activation_status_idx
            on leads (activation_status, updated_at desc);
          create index if not exists leads_account_user_idx
            on leads (account_user_id)
            where account_user_id is not null;
          create table if not exists member_branch_access (
            tenant_id text not null,
            user_id text not null,
            branch_id text not null,
            created_at timestamptz not null default now(),
            primary key (user_id, branch_id),
            foreign key (tenant_id) references tenants(id) on delete cascade,
            foreign key (branch_id) references branches(id) on delete cascade
          );
          create index if not exists member_branch_access_tenant_user_idx
            on member_branch_access (tenant_id, user_id);
          create index if not exists member_branch_access_branch_idx
            on member_branch_access (branch_id, user_id);
          insert into "user" ("id", "name", "email", "emailVerified", "phoneNumber", "phoneNumberVerified")
          values ('customer-lifecycle-user', 'Customer Lifecycle Test', 'customer-lifecycle@example.test', true, '+966500000001', true)
          on conflict ("id") do update set
            "name" = excluded."name",
            "email" = excluded."email",
            "emailVerified" = excluded."emailVerified",
            "phoneNumber" = excluded."phoneNumber",
            "phoneNumberVerified" = excluded."phoneNumberVerified";
          SQL
      - name: Prepare Studio browser fixture
        run: |
          cat > migrations/99999999_w7_3_studio_fixture.sql <<'SQL'
          alter table tenant_members
            add column if not exists access_role text not null default 'tenant_owner',
            add column if not exists branch_scope text[] null,
            add column if not exists is_active boolean not null default true;
          alter table orders
            add column if not exists archived_at timestamptz;
          insert into tenant_members (tenant_id, user_id, role, access_role, branch_scope)
          values ('demo-nafas', 'dev-user', 'owner', 'tenant_owner', null)
          on conflict (tenant_id, user_id) do update set is_active = true, role = 'owner', access_role = 'tenant_owner', branch_scope = null;
          SQL
      - name: Studio Shell, Home, Menu, Growth, Customers, and W7.10 responsive browser QA — auth-disabled local mode
        run: |
          mkdir -p .grok
          cleanup() {
            kill "$STUDIO_PID" 2>/dev/null || true
            rm -f migrations/99999998_w7_3_customer_activation_fixture.sql migrations/99999999_w7_3_studio_fixture.sql
          }
          trap cleanup EXIT
          setsid bash -c 'unset RUNNER_TRACKING_ID; exec env VITE_AUTH_ENABLED=false node scripts/with-app-env.mjs ./node_modules/vite/bin/vite.js --host 127.0.0.1 --port 8082' > .grok/studio-shell-browser.log 2>&1 < /dev/null &
          STUDIO_PID=$!
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail http://127.0.0.1:8082/studio >/dev/null; then
              echo "[studio-browser] serving http://127.0.0.1:8082/studio"
              set +e
              STUDIO_SHELL_BASE_URL=http://127.0.0.1:8082 npx playwright test tests/w7-3-studio-shell-browser.spec.ts tests/w7-4-studio-home-browser.spec.ts tests/w7-5-menu-workspace-browser.spec.ts tests/w7-6-growth-workspace-browser.spec.ts tests/w7-7-customers-workspace-browser.spec.ts tests/w7-10-responsive-studio-browser.spec.ts --workers=1
              STATUS=$?
              set -e
              if [ "$STATUS" -ne 0 ]; then
                echo "[studio-browser] Playwright failed — dev-server log follows"
                cat .grok/studio-shell-browser.log
              fi
              exit "$STATUS"
            fi
            sleep 0.25
          done
          echo "[studio-browser] failed to become ready — see .grok/studio-shell-browser.log"
          cat .grok/studio-shell-browser.log
          exit 1
      - name: Prepare Platform Admin browser database
        run: |
          mkdir -p .grok
          if [ -f scripts/prepare-platform-admin-browser.mjs ]; then
            node scripts/prepare-platform-admin-browser.mjs
          else
            echo "No dedicated Platform Admin database preparation script is present; using existing browser fixture boundary."
          fi
      - name: Platform Admin and W7.10 responsive browser QA — auth-disabled local mode
        run: |
          mkdir -p .grok
          cleanup() {
            kill "$ADMIN_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          setsid bash -c 'unset RUNNER_TRACKING_ID; exec env VITE_AUTH_ENABLED=false PLATFORM_ADMIN_USER_IDS=dev-user node scripts/with-app-env.mjs ./node_modules/vite/bin/vite.js --host 127.0.0.1 --port 8083' > .grok/platform-admin-browser.log 2>&1 < /dev/null &
          ADMIN_PID=$!
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail http://127.0.0.1:8083/admin >/dev/null; then
              echo "[admin-browser] serving http://127.0.0.1:8083/admin"
              set +e
              ADMIN_BASE_URL=http://127.0.0.1:8083 npx playwright test tests/w7-8-admin-browser.spec.ts tests/w7-9-admin-routes-browser.spec.ts tests/w7-10-responsive-admin-browser.spec.ts --workers=1
              STATUS=$?
              set -e
              if [ "$STATUS" -ne 0 ]; then
                echo "[admin-browser] Playwright failed — dev-server log follows"
                cat .grok/platform-admin-browser.log
              fi
              exit "$STATUS"
            fi
            sleep 0.25
          done
          echo "[admin-browser] failed to become ready — see .grok/platform-admin-browser.log"
          cat .grok/platform-admin-browser.log
          exit 1
      - name: Upload browser performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-performance-baseline
          path: .grok/performance-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Studio browser QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w7-3-studio-browser-diagnostics
          path: |
            .grok/studio-shell-browser.log
            .grok/platform-admin-browser.log
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop built preview
        if: always()
        run: npm run preview:stop
