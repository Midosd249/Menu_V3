name: Menu V3 Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      # TanStack Start generates routeTree.gen.ts during Vite build; generate it before tsc.
      - name: Generate route tree
        run: npx vite build --mode development
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Platform tests
        run: npm run test:platform
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser template QA
        run: |
          mkdir -p .grok
          setsid env -u RUNNER_TRACKING_ID npx vite preview --host 127.0.0.1 --port 8081 > .grok/preview.log 2>&1 < /dev/null &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail http://127.0.0.1:8081/ >/dev/null; then
              echo "[preview] serving http://127.0.0.1:8081/"
              npm run qa:template http://127.0.0.1:8081/themes/preview?theme=editorial
              exit $?
            fi
            sleep 0.25
          done
          echo "[preview] failed to become ready — see .grok/preview.log"
          cat .grok/preview.log
          exit 1
      - name: Stop built preview
        if: always()
        run: npm run preview:stop
