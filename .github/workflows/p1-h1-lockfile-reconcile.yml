name: P1-H1 Lockfile Reconciliation

on:
  push:
    branches: [codex/p1-h1-lockfile-reconciliation]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install metadata
        run: npm ci --ignore-scripts --dry-run

      - name: Commit reconciled lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(p1-h1): reconcile package lock"
          git push
