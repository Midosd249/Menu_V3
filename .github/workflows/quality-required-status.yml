name: Menu V3 Quality Required Status

on:
  workflow_run:
    workflows: ["Menu V3 Quality"]
    types: [completed]

permissions:
  actions: read
  statuses: write

jobs:
  quality-status:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish required quality status
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const state = run.conclusion === "success" ? "success" : "failure";
            const description = state === "success"
              ? "Menu V3 Quality workflow passed."
              : `Menu V3 Quality workflow concluded ${run.conclusion}.`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state,
              context: "quality",
              description,
              target_url: run.html_url,
            });
