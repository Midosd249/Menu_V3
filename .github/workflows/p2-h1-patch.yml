name: P2-H1 Patch

on:
  push:
    branches:
      - feat/p2-h1-analytics-no-data

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p2-h1-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply focused P2-H1 patch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');

            async function updateFile(path, transform, message) {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              const file = Array.isArray(current.data) ? current.data[0] : current.data;
              const source = Buffer.from(file.content, 'base64').toString('utf8');
              const next = transform(source);
              if (next === source) core.setFailed(`No change produced for ${path}`);
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                message,
                content: Buffer.from(next, 'utf8').toString('base64'),
                sha: file.sha,
                branch,
              });
            }

            await updateFile(
              'src/routes/studio/analytics.tsx',
              (source) => {
                const old = `      {!hasData ? <p className="rounded-xl border border-line px-4 py-10 text-center text-sm text-muted">{t(copy.state.noDataYet, lang)}</p> : null}\n      {hasData ? (\n        <>\n          <section className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">`;
                const next = `      {!hasData ? (\n        <>\n          <p className="rounded-xl border border-line px-4 py-10 text-center text-sm text-muted">{t(copy.state.noDataYet, lang)}</p>\n          <VisibilityReadiness studio={studio} analytics={analytics} lang={lang} />\n        </>\n      ) : null}\n      {hasData ? (\n        <>\n          <section className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">`;
                if (!source.includes(old)) core.setFailed('analytics.tsx expected no-data block not found');
                return source.replace(old, next);
              },
              'feat: keep visibility readiness visible without analytics data [p2-h1-patched]'
            );

            await updateFile(
              'tests/p2-growth-differentiation.test.mjs',
              (source) => {
                const marker = 'test("P2 experimentation surface is hypothesis-led and does not claim measured significance", () => {';
                const addition = `test("P2 local visibility remains visible when analytics has no events", () => {\n  assert.match(analytics, /!hasData \\? \\(\\s*<\\>\\s*<p className=.*noDataYet/);\n  assert.match(analytics, /<VisibilityReadiness studio=\\{studio\\} analytics=\\{analytics\\} lang=\\{lang\\} \\/>/);\n});\n\n`;
                if (!source.includes(marker)) core.setFailed('test insertion marker not found');
                return source.replace(marker, addition + marker);
              },
              'test: cover visibility readiness with no analytics data [p2-h1-patched]'
            );
