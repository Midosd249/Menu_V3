name: Reconcile npm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconcile lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Install from reconciled lockfile
        run: npm ci --no-audit --no-fund

      - name: Generate route tree
        run: npx vite build --mode development

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit reconciled lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json && git diff --quiet -- .github/workflows/reconcile-lockfile.yml; then
            echo "No lockfile changes required."
            exit 0
          fi
          git add package-lock.json .github/workflows/reconcile-lockfile.yml
          git commit -m "chore: reconcile npm lockfile"
          git push origin main
